name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, busydone/v1.5.3-port]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Python
        id: python
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        id: dependencies
        if: always()
        run: pip install -e . && pip install -r requirements.txt boto3 pytest pytest-xdist duckdb "pytz>=2024.1" docker cbor2 pyyaml cryptography aws-sam-translator websockets

      - name: Start MiniStack for serial tests
        id: serial_runtime
        if: always()
        run: |
          mkdir -p \
            "$RUNNER_TEMP/ministack-serial/tmp" \
            "$RUNNER_TEMP/ministack-serial/s3" \
            "$RUNNER_TEMP/ministack-serial/state"
          python - <<'PY'
          import socket

          with socket.create_connection(("localhost", 6379), timeout=5) as connection:
              connection.sendall(b"*1\r\n$8\r\nFLUSHALL\r\n")
              if connection.recv(1024) != b"+OK\r\n":
                  raise RuntimeError("Redis did not acknowledge FLUSHALL")
          PY
          TMPDIR="$RUNNER_TEMP/ministack-serial/tmp" \
            S3_DATA_DIR="$RUNNER_TEMP/ministack-serial/s3" \
            STATE_DIR="$RUNNER_TEMP/ministack-serial/state" \
            REDIS_HOST=localhost \
            python -m hypercorn ministack.app:app --bind 0.0.0.0:4566 --keep-alive 75 \
            > ministack-serial.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ministack-serial.pid"
          for i in $(seq 1 15); do
            curl -sf http://localhost:4566/_ministack/health && break
            echo "Waiting for MiniStack... ($i/15)"
            sleep 2
          done
          curl -sf http://localhost:4566/_ministack/health

      - name: Run serial tests
        id: serial_tests
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}/ministack-serial/tmp
          S3_DATA_DIR: ${{ runner.temp }}/ministack-serial/s3
          STATE_DIR: ${{ runner.temp }}/ministack-serial/state
        run: pytest tests/ -m serial -v --tb=short --durations=10

      - name: Stop serial MiniStack
        id: stop_serial
        if: always()
        run: |
          is_running() {
            state=$(ps -o stat= -p "$1" 2>/dev/null || true)
            case "$state" in
              ""|*Z*) return 1 ;;
              *) return 0 ;;
            esac
          }
          if [ -f "$RUNNER_TEMP/ministack-serial.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/ministack-serial.pid")
            if is_running "$pid"; then
              kill "$pid"
            fi
            for _ in $(seq 1 15); do
              if ! is_running "$pid"; then
                exit 0
              fi
              sleep 1
            done
            echo "Serial MiniStack did not stop" >&2
            exit 1
          fi

      - name: Start MiniStack for parallel tests
        id: parallel_runtime
        if: always()
        run: |
          is_running() {
            state=$(ps -o stat= -p "$1" 2>/dev/null || true)
            case "$state" in
              ""|*Z*) return 1 ;;
              *) return 0 ;;
            esac
          }
          if [ -f "$RUNNER_TEMP/ministack-serial.pid" ]; then
            serial_pid=$(cat "$RUNNER_TEMP/ministack-serial.pid")
            if is_running "$serial_pid"; then
              kill "$serial_pid"
              for _ in $(seq 1 15); do
                if ! is_running "$serial_pid"; then
                  break
                fi
                sleep 1
              done
              ! is_running "$serial_pid"
            fi
          fi
          mkdir -p \
            "$RUNNER_TEMP/ministack-parallel/tmp" \
            "$RUNNER_TEMP/ministack-parallel/s3" \
            "$RUNNER_TEMP/ministack-parallel/state"
          python - <<'PY'
          import socket

          with socket.create_connection(("localhost", 6379), timeout=5) as connection:
              connection.sendall(b"*1\r\n$8\r\nFLUSHALL\r\n")
              if connection.recv(1024) != b"+OK\r\n":
                  raise RuntimeError("Redis did not acknowledge FLUSHALL")
          PY
          TMPDIR="$RUNNER_TEMP/ministack-parallel/tmp" \
            S3_DATA_DIR="$RUNNER_TEMP/ministack-parallel/s3" \
            STATE_DIR="$RUNNER_TEMP/ministack-parallel/state" \
            REDIS_HOST=localhost \
            python -m hypercorn ministack.app:app --bind 0.0.0.0:4566 --keep-alive 75 \
            > ministack-parallel.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ministack-parallel.pid"
          for i in $(seq 1 15); do
            curl -sf http://localhost:4566/_ministack/health && break
            echo "Waiting for MiniStack... ($i/15)"
            sleep 2
          done
          curl -sf http://localhost:4566/_ministack/health

      - name: Run parallel tests
        id: parallel_tests
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}/ministack-parallel/tmp
          S3_DATA_DIR: ${{ runner.temp }}/ministack-parallel/s3
          STATE_DIR: ${{ runner.temp }}/ministack-parallel/state
        run: pytest tests/ -m 'not serial' -n 3 --dist=loadfile -v --tb=short --durations=25

      - name: Stop parallel MiniStack
        id: stop_parallel
        if: always()
        run: |
          is_running() {
            state=$(ps -o stat= -p "$1" 2>/dev/null || true)
            case "$state" in
              ""|*Z*) return 1 ;;
              *) return 0 ;;
            esac
          }
          if [ -f "$RUNNER_TEMP/ministack-parallel.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/ministack-parallel.pid")
            if is_running "$pid"; then
              kill "$pid"
            fi
            for _ in $(seq 1 15); do
              if ! is_running "$pid"; then
                exit 0
              fi
              sleep 1
            done
            echo "Parallel MiniStack did not stop" >&2
            exit 1
          fi

      - name: Upload MiniStack logs
        id: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ministack.log
          path: ministack-*.log
          if-no-files-found: warn

      - name: Assert complete test outcome
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SERIAL_RUNTIME_OUTCOME: ${{ steps.serial_runtime.outcome }}
          SERIAL_TESTS_OUTCOME: ${{ steps.serial_tests.outcome }}
          STOP_SERIAL_OUTCOME: ${{ steps.stop_serial.outcome }}
          PARALLEL_RUNTIME_OUTCOME: ${{ steps.parallel_runtime.outcome }}
          PARALLEL_TESTS_OUTCOME: ${{ steps.parallel_tests.outcome }}
          STOP_PARALLEL_OUTCOME: ${{ steps.stop_parallel.outcome }}
        run: |
          for outcome in \
            "$CHECKOUT_OUTCOME" \
            "$PYTHON_OUTCOME" \
            "$DEPENDENCIES_OUTCOME" \
            "$SERIAL_RUNTIME_OUTCOME" \
            "$SERIAL_TESTS_OUTCOME" \
            "$STOP_SERIAL_OUTCOME" \
            "$PARALLEL_RUNTIME_OUTCOME" \
            "$PARALLEL_TESTS_OUTCOME" \
            "$STOP_PARALLEL_OUTCOME"; do
            [ "$outcome" = "success" ] || exit 1
          done
